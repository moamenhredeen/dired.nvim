name: release

# Build the native sidecar binary for every supported platform and publish it:
#   - push to main -> rolling "nightly" prerelease (so `branch = "main"` lazy
#     configs get a working prebuilt binary)
#   - push tag v*  -> versioned release
# Native runners per target avoid cross-compiling the C-based crates (bzip2, xz2).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            bin: dired-core
            asset: dired-core-x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            bin: dired-core
            asset: dired-core-aarch64-unknown-linux-gnu
          - runner: macos-13
            bin: dired-core
            asset: dired-core-x86_64-apple-darwin
          - runner: macos-14
            bin: dired-core
            asset: dired-core-aarch64-apple-darwin
          - runner: windows-latest
            bin: dired-core.exe
            asset: dired-core-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        shell: bash
        run: cargo build --release --manifest-path rust/Cargo.toml
      - name: Rename artifact
        shell: bash
        run: cp "rust/target/release/${{ matrix.bin }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish rolling nightly (push to main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create nightly dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "nightly" \
            --notes "Rolling build of main (${GITHUB_SHA})." \
            --prerelease \
            --target "$GITHUB_SHA"
      - name: Publish versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
