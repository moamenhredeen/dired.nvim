[package]
name = "dired-core"
version = "0.1.0"
edition = "2021"

# Sidecar CLI invoked by the plugin via vim.system. A small lib target keeps the
# logic importable from integration tests in tests/.
[lib]
name = "dired_core"
path = "src/lib.rs"

[[bin]]
name = "dired-core"
path = "src/main.rs"

[dependencies]
tar = "0.4"
flate2 = "1"
bzip2 = "0.5"
xz2 = { version = "0.1", features = ["static"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
