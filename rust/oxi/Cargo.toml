# nvim-facing glue only; all logic lives in dired-engine so it stays testable
# with plain `cargo test` (this crate's symbols only resolve inside nvim).
[package]
name = "dired-core"
version.workspace = true
edition.workspace = true

[lib]
name = "dired_core"
crate-type = ["cdylib"]

[dependencies]
dired-engine = { path = "../engine" }
# git: crates.io 0.6.0 predates the neovim-0-11/0-12 features. Build against the
# lowest API level we support (0.11) so one binary loads on 0.11 and 0.12 alike;
# a 0-12 build would fail to load on 0.11.
nvim-oxi = { git = "https://github.com/noib3/nvim-oxi", features = ["neovim-0-11", "libuv"] }
